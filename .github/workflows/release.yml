name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish checked release assets
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches workspace version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RELEASE_TAG}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${INPUT_TAG:-v1.1.0}"
          fi
          echo "RESOLVED_TAG=$TAG" >> $GITHUB_ENV
          python3 tools/check_project.py --tag "$TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalam-linux-x86_64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kalam-android-apk
          path: dist
      - name: Publish Kalam release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          if [ -f SHA256SUMS.android ]; then
            sha256sum --check SHA256SUMS.android
            cat SHA256SUMS.android >> SHA256SUMS
            rm -f SHA256SUMS.android
          fi
          cd ..
          gh release create "$RESOLVED_TAG" dist/*.tar.gz dist/*.apk dist/SHA256SUMS \
            --title "Kalam V${RESOLVED_TAG#v} - Android Support" --notes-file docs/RELEASE_NOTES.md

