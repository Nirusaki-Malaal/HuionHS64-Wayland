name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    name: Publish checked release assets
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches workspace version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RELEASE_TAG}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${INPUT_TAG:-v1.1.0}"
          fi
          echo "RESOLVED_TAG=$TAG" >> $GITHUB_ENV
          python3 tools/check_project.py --tag "$TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Publish Kalam release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          find artifacts/ -type f -name "*.tar.gz" -exec cp -f {} dist/ \;
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          cd ..
          if gh release view "$RESOLVED_TAG" >/dev/null 2>&1; then
            gh release edit "$RESOLVED_TAG" --title "Kalam V${RESOLVED_TAG#v} - Multi-Arch Linux" --notes-file docs/RELEASE_NOTES.md
            gh release upload "$RESOLVED_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$RESOLVED_TAG" dist/*.tar.gz dist/SHA256SUMS \
              --title "Kalam V${RESOLVED_TAG#v} - Multi-Arch Linux" --notes-file docs/RELEASE_NOTES.md
          fi


