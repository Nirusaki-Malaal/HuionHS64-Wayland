name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Linux checks and release packaging (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config binutils
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Check metadata, attribution and text
        run: python3 tools/check_project.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Check installation script syntax
        run: |
          sh -n install.sh uninstall.sh bootstrap.sh
          python3 -m py_compile scripts/manage_install.py scripts/online_install.py tools/package_release.py tools/check_project.py tools/benchmark.py tests/packaging_e2e.py tests/online_install_test.py
      - name: Test distro, session and non-systemd installation handling
        run: python3 tests/online_install_test.py
      - name: Build release binaries
        run: cargo build --release --locked --workspace
      - name: Package and test extracted installer
        run: |
          python3 tools/package_release.py --arch ${{ matrix.arch }}
          python3 tests/packaging_e2e.py --arch ${{ matrix.arch }}
      - name: Upload binary bundle and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kalam-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  android-checks:
    name: Android checks and APK build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Build Android APKs
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Prepare APK release artifacts
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/app-release.apk dist-android/kalam-android-v1.1.0.apk 2>/dev/null || cp android/app/build/outputs/apk/debug/app-debug.apk dist-android/kalam-android-v1.1.0.apk
          cp dist-android/kalam-android-v1.1.0.apk dist-android/kalam-android-arm64-v1.1.0.apk
          cd dist-android
          sha256sum kalam-android-v1.1.0.apk kalam-android-arm64-v1.1.0.apk > SHA256SUMS.android
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kalam-android-apk
          path: |
            dist-android/*.apk
            dist-android/SHA256SUMS.android
          if-no-files-found: error
          retention-days: 14
