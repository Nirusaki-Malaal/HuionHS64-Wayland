[workspace]
members = [
    "crates/huion-proto",
    "crates/huion-daemon",
    "crates/huion-gui",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["nirusaki"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Nirusaki-Malaal/HuionHS64-Wayland"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.43", features = ["full"] }
zbus = "5.5"
evdev = "0.12"
nix = { version = "0.29", features = ["fs", "ioctl", "poll"] }
